              <h2>You built the OpEx machine</h2>
              <div class="text-block">
                <p class="lead">
                  From a shaky partnership idea to a full department serving commercial roofing ops —
                  you made the climb. Here’s how you did.
                </p>
              </div>
              <div class="rank-banner ${rank.tier}">${rank.emoji} ${rank.title}</div>
              <div class="scorecard">
                <div class="score-box"><div class="num">${score}</div><div class="lbl">OpEx Points</div></div>
                <div class="score-box"><div class="num">${goodChoices}</div><div class="lbl">Good calls</div></div>
                <div class="score-box"><div class="num">${badChoices}</div><div class="lbl">Pitfalls hit</div></div>
              </div>
              <div class="text-block">
                <p class="consequence">
                  ${rank.blurb}
                  <span class="punch">
                    Path: Partnership → KPIs → Growth → Specialists → Training → Analyst → Department.
                    Skip a link and the chain breaks. Nail them in order and OpEx becomes how you work.
                  </span>
                </p>
              </div>
              <div class="btn-row">
                <button type="button" class="btn btn-primary" data-goto="restart">Play again →</button>
                <button type="button" class="btn btn-ghost" id="shareScoreBtn">📤 Share Score</button>
                <button type="button" class="btn btn-ghost" data-goto="title">Back to title</button>
                <button type="button" class="btn btn-ghost" id="openOverviewFromFinale">Exec overview</button>
              </div>
              <p class="footer-note">OpEx Tower · Commercial Roofing · Build wisely</p>
            </div>`;
        }
      }
    };

    function choicesHtml(items) {
      return `<div class="choices">${items.map((c, i) => `
        <button type="button" class="choice ${i % 2 === 0 ? "choice-purple" : "choice-teal"}" data-choice="${c.id}">
          <span class="choice-letter">${c.letter}</span>
          <span class="choice-body">
            <span class="choice-title">${c.title}</span>
            <span class="choice-sub">${c.sub}</span>
          </span>
          <span class="choice-arrow" aria-hidden="true">${i % 2 === 0 ? "➤" : "➜"}</span>
          <span class="choice-verdict" aria-hidden="true"></span>
        </button>`).join("")}</div>`;
    }

    function hintControls(sceneId) {
      const used = hintsUsedOnScene[sceneId] || 0;
      let label = "💡 Hint (free)";
      if (used === 1) label = "💡 Deeper hint (−50 ⚡)";
      else if (used >= 2) label = "💡 All hints used";
      return `
        <div class="hint-row">
          <button type="button" class="hint-btn" data-hint="${sceneId}" ${used >= 2 ? "disabled" : ""}>${label}</button>
        </div>
        <div class="hint-panel" id="hintPanel">
          <div class="hint-inner">
            <div class="hint-label">Hint</div>
            <p class="hint-body" id="hintBody"></p>
          </div>
        </div>`;
    }

    function resultPanel(good, toast, badge, title, body, next, nextLabel) {
      const tryAgain = good ? "" : `<button type="button" class="btn btn-try" data-try-again>↻ Try Again</button>`;
      return `
        <div class="panel ${good ? "win" : "pitfall"}">
          <div class="points-toast ${good ? "up" : "down"}">${toast}</div>
          <div class="badge ${good ? "success" : "danger"}">${badge}</div>
          <h2>${title}</h2>
          <div class="text-block"><p class="consequence">${body}</p></div>
          <div class="btn-row">
            <button type="button" class="btn btn-primary" data-goto="${next}">${nextLabel}</button>
            ${tryAgain}
          </div>
        </div>`;
    }

    function getRank(pts) {
      if (pts >= 160) return { tier: "s", emoji: "🏆", title: "OpEx Legend — Rooftop Royalty", blurb: "You played this like a pro. Strong partnership, real KPIs, disciplined growth, field credibility, training that sticks, decision-grade data, and a department that serves. The crews would invite you to lunch." };
      if (pts >= 110) return { tier: "a", emoji: "⚡", title: "Ops Ace — Solid Foundation", blurb: "You made the big calls right and recovered when you slipped. Your OpEx program has legs." };
      if (pts >= 70) return { tier: "b", emoji: "🔧", title: "Field Fixer — Work in Progress", blurb: "You got there, with detours through Pitfall City. That’s realistic. Keep tightening the system." };
      if (pts >= 25) return { tier: "c", emoji: "😅", title: "Survived the Climb — Barely", blurb: "You finished, but OpEx took some hits. Revisit partnership and field credibility first." };
      return { tier: "d", emoji: "🪂", title: "Hard Hat Hero — Lessons Everywhere", blurb: "The pitfalls found you. OpEx is a journey, not a one-take. Run it again aiming for partnership + real KPIs first." };
    }

    function isGoodChoice(id) { return scenes[id] && scenes[id].good === true; }
    function isBadChoice(id) { return scenes[id] && scenes[id].good === false; }

    // ——— UI helpers ———
    const stage = document.getElementById("stage");
    const scorePts = document.getElementById("scorePts");
    const scoreChip = document.getElementById("scoreChip");
    const progressFill = document.getElementById("progressFill");
    const progressPct = document.getElementById("progressPct");
    const phaseLabel = document.getElementById("phaseLabel");
    const overviewOverlay = document.getElementById("overviewOverlay");

    function animateScoreTo(target) {
      if (scoreAnimRaf) cancelAnimationFrame(scoreAnimRaf);
      const start = displayScore, diff = target - start;
      if (!diff) { scorePts.textContent = String(target); return; }
      const t0 = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - t0) / 550);
        displayScore = Math.round(start + diff * (1 - Math.pow(1 - t, 3)));
        scorePts.textContent = String(displayScore);
        if (t < 1) scoreAnimRaf = requestAnimationFrame(tick);
        else { displayScore = target; scorePts.textContent = String(target); }
      }
      scoreChip.classList.remove("bump"); void scoreChip.offsetWidth; scoreChip.classList.add("bump");
      scoreAnimRaf = requestAnimationFrame(tick);
    }

    function flyScore(el, delta) {
      if (!el || !delta) return;
      const rect = el.getBoundingClientRect();
      const fly = document.createElement("div");
      fly.className = "fly-score " + (delta > 0 ? "up" : "down");
      fly.textContent = (delta > 0 ? "+" : "") + delta + " ⚡";
      fly.style.left = rect.left + rect.width / 2 + "px";
      fly.style.top = rect.top + rect.height / 2 + "px";
      document.body.appendChild(fly);
      setTimeout(() => fly.remove(), 850);
    }

    function applyPoints(delta, sourceEl) {
      if (!delta) return;
      score += delta;
      if (score < 0) score = 0;
      flyScore(sourceEl || scoreChip, delta);
      animateScoreTo(score);
      playSound(delta > 0 ? "points" : "pointsDown");
    }

    function updateHUD(scene) {
      const onTitle = currentSceneId === "title";
      document.getElementById("progressWrap").style.visibility = onTitle ? "hidden" : "visible";
      scoreChip.style.visibility = onTitle ? "hidden" : "visible";
      const p = Math.min(100, Math.max(0, scene.progress || 0));
      progressFill.style.width = p + "%";
      progressPct.textContent = p + "%";
      phaseLabel.textContent = phaseNames[scene.phase] || "Build";
    }

    function showScene(id, opts = {}) {
      if (transitioning && !opts.force) return;
      if (id === "restart") {
        score = 0; displayScore = 0; goodChoices = 0; badChoices = 0;
        history = []; navStack = []; lastChoiceFrom = null;
        hintsUsedOnScene = {}; journeyStartTime = null; selectedChoiceIndex = 0;
        scorePts.textContent = "0";
        resetBuilding();
        clearProgress();
        window.__opexSaved = null;
        id = "title";
      }
      const scene = scenes[id];
      if (!scene) return;

      if (!opts.back && !opts.tryAgain && currentSceneId && currentSceneId !== id) {
        navStack.push(currentSceneId);
        if (navStack.length > 80) navStack.shift();
      }
      if (!journeyStartTime && id !== "title") journeyStartTime = Date.now();

      transitioning = true;
      currentSceneId = id;
      selectedChoiceIndex = 0;

      const prev = activeEl;
      const next = document.createElement("section");
      next.className = "scene";
      next.innerHTML = `<div class="scene-inner">${scene.render()}</div>`;
      stage.appendChild(next);

      if (opts.applyPoints && typeof scene.points === "number") {
        applyPoints(scene.points, opts.sourceEl);
        if (scene.good === true) { goodChoices++; playSound("success"); }
        if (scene.good === false) { badChoices++; playSound("fail"); }
      }

      syncBuildingToScene(id, scene, opts);
      updateHUD(scene);
      if (id !== "title" && id !== "restart") saveProgress();

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          next.classList.add("active");
          if (prev) { prev.classList.remove("active"); prev.classList.add("exit"); }
        });
      });

      setTimeout(() => {
        if (prev && prev.parentNode) prev.remove();
        activeEl = next;
        transitioning = false;
        updateChoiceFocus();
        const focusable = next.querySelector(".choice, .btn-primary, button");
        if (focusable) focusable.focus({ preventScroll: true });
        const ov = next.querySelector("#openOverviewFromFinale");
        if (ov) ov.addEventListener("click", openOverview);
        const sh = next.querySelector("#shareScoreBtn");
        if (sh) sh.addEventListener("click", shareScore);
        const resume = next.querySelector("#resumeBtn");
        if (resume) resume.addEventListener("click", () => {
          playSound("click");
          const s = window.__opexSaved;
          if (!s || !scenes[s.currentSceneId]) return;
          score = s.score || 0;
          displayScore = score;
          scorePts.textContent = String(score);
          goodChoices = s.goodChoices || 0;
          badChoices = s.badChoices || 0;
          journeyStartTime = s.journeyStartTime || Date.now();
          if (Array.isArray(s.floorState) && s.floorState.length === floorState.length) {
            floorState = s.floorState.slice();
            applyFloorClasses();
          }
          showScene(s.currentSceneId, { force: true });
        });
      }, 520);
    }

    function updateChoiceFocus() {
      if (!activeEl) return;
      activeEl.querySelectorAll(".choice").forEach((c, i) => c.classList.toggle("kb-focus", i === selectedChoiceIndex));
    }

    function spawnPointBurst(btn) {
      const burst = document.createElement("div");
      burst.className = "point-burst";
      for (let i = 0; i < 8; i++) {
        const s = document.createElement("span");
        const a = (Math.PI * 2 * i) / 8;
        s.style.setProperty("--bx", Math.cos(a) * 40 + "px");
        s.style.setProperty("--by", Math.sin(a) * 40 - 15 + "px");
        s.textContent = i % 2 ? "+" : "⚡";
        burst.appendChild(s);
      }
      btn.appendChild(burst);
      setTimeout(() => burst.remove(), 750);
    }

    function goBackOneScene() {
      if (transitioning) return;
      if (overviewOverlay.classList.contains("open")) { closeOverview(); return; }
      if (!navStack.length) return;
      playSound("click");
      showScene(navStack.pop(), { back: true, force: true });
    }

    function tryAgainFromPitfall() {
      if (transitioning) return;
      const scene = scenes[currentSceneId];
      if (!scene || scene.good !== false) return;
      const target = lastChoiceFrom || (history.length ? history[history.length - 1].from : null);
      if (!target) return;
      if (typeof scene.points === "number") {
        score += -scene.points;
        if (score < 0) score = 0;
        animateScoreTo(score);
      }
      if (badChoices > 0) badChoices--;
      if (history.length && history[history.length - 1].choice === currentSceneId) history.pop();
      if (navStack.length && navStack[navStack.length - 1] === target) navStack.pop();
      // Clear crack on try again (rebuild)
      const fi = floorForScene(currentSceneId);
      if (fi >= 0 && floorState[fi] === "cracked") {
        floorState[fi] = "built";
        applyFloorClasses();
      }
      playSound("click");
      showScene(target, { tryAgain: true, force: true });
    }

    function advancePrimary() {
      if (transitioning || !activeEl || overviewOverlay.classList.contains("open")) return;
      const choices = activeEl.querySelectorAll(".choice");
      if (choices.length) {
        (choices[selectedChoiceIndex] || choices[0]).click();
        return;
      }
      const primary = activeEl.querySelector(".btn-primary[data-goto], [data-goto].btn-primary");
      if (primary) { playSound("click"); primary.click(); }
      else {
        const g = activeEl.querySelector("[data-goto]");
        if (g) { playSound("click"); g.click(); }
      }
    }

    function shareScore() {
      const elapsed = journeyStartTime ? Date.now() - journeyStartTime : 0;
      let minutes = Math.round(elapsed / 60000);
      if (elapsed > 0 && minutes < 1) minutes = 1;
      if (!elapsed) minutes = 1;
      const phaseNum = Math.max(1, Math.min(5, highestLit + 1 || 1));
      const rank = getRank(score);
      const text = `I scored ${score} OpEx points on The OpEx Journey! ${rank.emoji} ${rank.title}\nReached Phase ${phaseNum} in ${minutes} minute${minutes === 1 ? "" : "s"}.\nBuild OpEx floor by floor — commercial roofing edition.`;
      const toast = document.getElementById("shareToast");
      const show = (m) => { toast.textContent = m; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 2200); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => { playSound("success"); show("Score copied to clipboard!"); })
          .catch(() => fallbackCopy(text, show));
      } else fallbackCopy(text, show);
    }
    function fallbackCopy(text, show) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
        playSound("success"); show("Score copied to clipboard!");
      } catch (_) { show("Copy failed"); window.prompt("Copy your score:", text); }
    }

    // Clicks
    stage.addEventListener("click", (e) => {
      if (e.target.closest("[data-try-again]")) { tryAgainFromPitfall(); return; }
      const hintBtn = e.target.closest("[data-hint]");
      if (hintBtn && !hintBtn.disabled) {
        playSound("click");
        handleHint(hintBtn.getAttribute("data-hint"), hintBtn);
        return;
      }
      const btn = e.target.closest("[data-goto], [data-choice]");
      if (!btn || transitioning) return;
      const goto = btn.getAttribute("data-goto");
      const choice = btn.getAttribute("data-choice");
      if (goto) { playSound("click"); showScene(goto); return; }
      if (choice) {
        lastChoiceFrom = currentSceneId;
        history.push({ from: currentSceneId, choice });
        playSound("click");
        climberEl.classList.remove("decision-glow");
        void climberEl.offsetWidth;
        climberEl.classList.add("decision-glow");
        setTimeout(() => climberEl.classList.remove("decision-glow"), 700);
        const verdict = btn.querySelector(".choice-verdict");
        if (isGoodChoice(choice)) {
          btn.classList.add("right-reveal");
          if (verdict) verdict.textContent = "✓";
          spawnPointBurst(btn);
          setTimeout(() => {
            btn.classList.add("slide-out");
            setTimeout(() => showScene(choice, { applyPoints: true, sourceEl: btn }), 260);
          }, 450);
        } else if (isBadChoice(choice)) {
          btn.classList.add("wrong-reveal");
          if (verdict) verdict.textContent = "✕";
          setTimeout(() => {
            btn.classList.add("slide-out");
            setTimeout(() => showScene(choice, { applyPoints: true, sourceEl: btn }), 260);
          }, 480);
        } else {
          showScene(choice, { applyPoints: true, sourceEl: btn });
        }
      }
    });

    function handleHint(sceneId, btn) {
      const scene = scenes[sceneId];
      if (!scene || !scene.hints) return;
      const used = hintsUsedOnScene[sceneId] || 0;
      if (used >= 2) return;
      if (used === 1) {
        if (score < 50) {
          const prev = btn.textContent;
          btn.textContent = "💡 Need 50 ⚡";
          setTimeout(() => { btn.textContent = prev; }, 1200);
          return;
        }
        applyPoints(-50, btn);
      }
      hintsUsedOnScene[sceneId] = used + 1;
      const panel = document.getElementById("hintPanel");
      const body = document.getElementById("hintBody");
      if (panel && body) {
        body.textContent = scene.hints[used];
        panel.classList.add("open");
      }
      const n = hintsUsedOnScene[sceneId];
      if (n >= 2) { btn.textContent = "💡 All hints used"; btn.disabled = true; }
      else if (n === 1) btn.textContent = "💡 Deeper hint (−50 ⚡)";
    }

    // Keyboard
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        if (overviewOverlay.classList.contains("open")) { closeOverview(); playSound("click"); }
        else goBackOneScene();
        return;
      }
      if (overviewOverlay.classList.contains("open") || transitioning) return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        const choices = activeEl ? activeEl.querySelectorAll(".choice") : [];
        if (!choices.length) return;
        e.preventDefault();
        selectedChoiceIndex = e.key === "ArrowDown"
          ? (selectedChoiceIndex + 1) % choices.length
          : (selectedChoiceIndex - 1 + choices.length) % choices.length;
        updateChoiceFocus();
        playSound("click");
        choices[selectedChoiceIndex].focus({ preventScroll: true });
        return;
      }
      if (e.key === " " || e.key === "Spacebar" || e.key === "ArrowRight" || e.key === "Enter") {
        if (e.key === "Enter" && e.target && e.target.closest("button") && !e.target.classList.contains("choice")) return;
        e.preventDefault();
        advancePrimary();
        return;
      }
      if (e.key === "ArrowLeft") { e.preventDefault(); goBackOneScene(); }
    });

    // Overview
    const OVERVIEW = [
      { title: "Foundation · Partnership", body: "Found OpEx with an operational co-owner who has field credibility.", tip: "Ops > sales as founding partner." },
      { title: "KPIs & Growth", body: "Field-real metrics and pilot-based scale before headcount explosions.", tip: "Kill vanity metrics. Prove then spread." },
      { title: "Floor 1 · Field Specialists", body: "Peer coaches from respected crews — not clipboard police.", tip: "Credibility on the roof first." },
      { title: "Floor 2 · Training", body: "Short, hands-on modules reinforced on live work.", tip: "Practice > PowerPoint > abandoned videos." },
      { title: "Floor 3 · Data", body: "An analyst who turns chaos into weekly decisions.", tip: "Dashboards need a human owner." },
      { title: "Rooftop · Full Department", body: "Lean OpEx team as a service to the field.", tip: "Service culture beats audit police." }
    ];
    function openOverview() {
      document.getElementById("overviewBody").innerHTML = OVERVIEW.map((s, i) => `
        <div class="overview-step" style="--i:${i + 1}">
          <div class="ov-num">${i + 1}</div>
          <div class="ov-content"><h3>${s.title}</h3><p>${s.body}</p><div class="ov-tip">✓ ${s.tip}</div></div>
        </div>`).join("");
      overviewOverlay.hidden = false;
      overviewOverlay.classList.add("open");
    }
    function closeOverview() {
      overviewOverlay.classList.remove("open");
      overviewOverlay.hidden = true;
    }
    document.getElementById("skipBtn").addEventListener("click", () => { playSound("click"); openOverview(); });
    document.getElementById("overviewClose").addEventListener("click", () => { playSound("click"); closeOverview(); });
    document.getElementById("overviewClose2").addEventListener("click", () => { playSound("click"); closeOverview(); });
    document.getElementById("overviewPlay").addEventListener("click", () => {
      playSound("click"); closeOverview();
      if (currentSceneId === "title") showScene("intro");
    });
    overviewOverlay.addEventListener("click", (e) => { if (e.target === overviewOverlay) closeOverview(); });

    // Responsive layout mode (desktop >900 / mobile ≤899) — CSS media queries + data attribute
    function syncLayoutMode() {
      const mobile = window.innerWidth < 900;
      document.body.setAttribute("data-layout", mobile ? "mobile" : "desktop");
      document.body.classList.toggle("layout-mobile", mobile);
      document.body.classList.toggle("layout-desktop", !mobile);
      // Reposition climber after floor-height CSS vars change
      requestAnimationFrame(() => moveClimber(climberLevel));
    }
    window.addEventListener("resize", () => {
      syncLayoutMode();
    });
    syncLayoutMode();

    // Boot
    window.__opexSaved = loadProgress();
    resetBuilding();
    showScene("title", { force: true });
  })();
  </script>
</body>
</html>
