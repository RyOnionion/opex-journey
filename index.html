<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpEx Journey — Enhanced Build</title>
  <meta name="description" content="Construction building game: build OpEx floor by floor for commercial roofing." />
  <style>
    :root {
      --bg: #13131a;
      --bg-deep: #0a0a1a;
      --bg-header: #080810;
      --panel: transparent;
      --elevated: rgba(20, 20, 32, 0.9);
      --text: #e8e8f0;
      --muted: #c8c8d8;
      --purple: #6c63ff;
      --teal: #00d4aa;
      --gold: #f0c14b;
      --amber: #ffb347;
      --danger: #f07178;
      --success: #3ecf8e;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --hud-h: 58px;
      /* Desktop defaults (≥900px): 55/45 split, tall floors */
      --floor-h: 120px;
      --story-w: 55%;
      --build-w: 45%;
      --scene-max: 600px;
      --body-size: 1.1rem;
      --btn-h: auto;
      --anim-scale: 1;
    }

    [data-theme="light"] {
      --bg: #f4f6fb;
      --bg-deep: #e8ecf4;
      --bg-header: #ffffff;
      --panel: rgba(255, 255, 255, 0.92);
      --elevated: #ffffff;
      --text: #0f172a;
      --muted: #4a5568;
      --purple: #6c63ff;
      --teal: #00b894;
      --gold: #b45309;
      --danger: #dc2626;
      --success: #059669;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      background: var(--bg);
    }

    /* HUD */
    .hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--hud-h);
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px;
      padding-top: env(safe-area-inset-top);
      background: var(--bg-header);
      border-bottom: 1px solid rgba(108, 99, 255, 0.15);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .hud > * { pointer-events: auto; }
    [data-theme="light"] .hud { background: var(--bg-header); }

    .brand {
      font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.08em;
      color: var(--muted); white-space: nowrap;
    }
    .brand span {
      background: linear-gradient(135deg, var(--purple), var(--teal));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }

    .progress-wrap { flex: 1; min-width: 0; max-width: 280px; margin: 0 auto; }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 3px;
    }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--purple), var(--teal));
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 12px rgba(108, 99, 255, 0.45);
    }

    .score-chip, .icon-btn, .skip-btn {
      border: 1px solid rgba(108, 99, 255, 0.25);
      background: rgba(10, 10, 22, 0.9);
      backdrop-filter: blur(10px);
      color: var(--text);
      font-family: var(--font);
      cursor: pointer;
    }
    .score-chip {
      display: flex; align-items: center; gap: 5px;
      border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 0.9rem;
    }
    .score-chip .pts { color: var(--gold); font-variant-numeric: tabular-nums; min-width: 2ch; }
    .score-chip.bump .pts { animation: scorePulse 0.45s ease; }
    @keyframes scorePulse {
      40% { transform: scale(1.3); color: var(--success); }
    }

    .hud-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center; font-size: 1rem;
    }
    .skip-btn {
      height: 36px; border-radius: 99px; padding: 0 12px;
      font-size: 0.75rem; font-weight: 600; color: var(--muted);
    }
    .icon-btn:hover, .skip-btn:hover { box-shadow: 0 0 14px rgba(108, 99, 255, 0.35); transform: scale(1.04); }
    .icon-btn[aria-pressed="true"] { border-color: var(--purple); }

    /* Main split — desktop: 55% story / 45% building */
    .game {
      display: grid;
      grid-template-columns: var(--story-w) var(--build-w);
      height: 100%;
      padding-top: var(--hud-h);
    }

    .story-col {
      position: relative;
      overflow: hidden;
      min-width: 0;
      background: #13131a;
    }

    .stage {
      position: absolute; inset: 0;
      overflow: hidden;
      background: #13131a;
    }

    .scene {
      position: absolute; inset: 0;
      overflow-y: auto;
      padding: 18px 22px 28px;
      opacity: 0; visibility: hidden;
      transform: translateX(-16px) scale(0.98);
      filter: blur(3px);
      transition: opacity 0.5s, transform 0.5s, filter 0.5s, visibility 0s linear 0.5s;
      -webkit-overflow-scrolling: touch;
      background: transparent;
    }
    .scene.active {
      opacity: 1; visibility: visible;
      transform: none; filter: none;
      transition: opacity 0.5s, transform 0.5s, filter 0.5s, visibility 0s;
    }
    .scene.exit {
      opacity: 0; transform: translateX(12px) scale(0.98); filter: blur(4px);
    }

    .scene-inner {
      max-width: var(--scene-max);
      margin: 0 auto;
      width: 100%;
    }

    /* Floating text — no white card */
    .panel {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0.35rem 0.15rem 1rem;
      box-shadow: none;
      position: relative;
      backdrop-filter: none;
    }
    .panel.win { border: none; }
    .panel.pitfall { border: none; }
    .panel.win::before,
    .panel.pitfall::before { display: none; }

    .badge {
      display: inline-flex; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #e0dcff;
      background: rgba(108, 99, 255, 0.22);
      border: 1px solid rgba(108, 99, 255, 0.55);
      padding: 6px 14px; border-radius: 99px; margin-bottom: 14px;
      box-shadow:
        0 0 16px rgba(108, 99, 255, 0.45),
        0 0 32px rgba(108, 99, 255, 0.2),
        inset 0 0 12px rgba(108, 99, 255, 0.15);
    }
    .badge.success {
      color: #b8ffe0; background: rgba(62,207,142,0.18); border-color: rgba(62,207,142,0.55);
      box-shadow: 0 0 16px rgba(62, 207, 142, 0.4), 0 0 28px rgba(0, 212, 170, 0.2);
    }
    .badge.danger {
      color: #ffd0d4; background: rgba(240,113,120,0.18); border-color: rgba(240,113,120,0.55);
      box-shadow: 0 0 16px rgba(240, 113, 120, 0.4);
    }
    .badge.gold {
      color: #ffe9a8; background: rgba(240,193,75,0.16); border-color: rgba(240,193,75,0.5);
      box-shadow: 0 0 16px rgba(240, 193, 75, 0.35);
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(2.8rem, 7vw, 4.6rem);
      line-height: 1.05; font-weight: 400; letter-spacing: 0.02em; margin-bottom: 14px;
      background: linear-gradient(135deg, #6c63ff, #00d4aa);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 28px rgba(108, 99, 255, 0.4));
    }
    h2 {
      font-family: var(--display);
      font-size: clamp(1.85rem, 4.2vw, 2.85rem);
      line-height: 1.1; font-weight: 400; letter-spacing: 0.02em; margin-bottom: 14px;
      background: linear-gradient(135deg, #6c63ff, #00d4aa);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 18px rgba(108, 99, 255, 0.35));
    }

    .text-block {
      background: transparent;
      border-radius: 0; padding: 0; margin-bottom: 1rem;
      border: none;
    }
    [data-theme="light"] .text-block { background: transparent; }

    p, .lead, .flavor, .consequence, .choice-sub, .hint-body {
      font-size: 1.1rem; line-height: 1.9; color: #e8e8f0;
    }
    .lead { color: #e8e8f0; }
    .lead strong, .consequence strong, .kw-purple { color: #a78bfa; font-weight: 700; }
    .kw-teal { color: var(--teal); font-weight: 700; }
    .consequence { color: #e8e8f0; }
    .flavor {
      font-style: italic;
      color: #d4d4e4;
      border-left: 3px solid transparent;
      border-image: linear-gradient(180deg, #6c63ff, #00d4aa) 1;
      padding: 0.85rem 1rem 0.85rem 1.1rem;
      margin: 0.25rem 0;
      background: rgba(12, 12, 24, 0.75);
      border-radius: 0 10px 10px 0;
      box-shadow:
        inset 4px 0 18px -4px rgba(108, 99, 255, 0.55),
        0 0 20px rgba(108, 99, 255, 0.08);
    }
    .punch {
      display: block; margin-top: 12px; font-style: italic; color: #d0d0e0;
      border-left: 3px solid rgba(0, 212, 170, 0.7);
      padding: 0.75rem 1rem 0.75rem 1.1rem;
      background: rgba(10, 18, 22, 0.65);
      border-radius: 0 10px 10px 0;
      box-shadow: inset 4px 0 16px -4px rgba(0, 212, 170, 0.4);
    }

    .hero-icon { font-size: 2.5rem; margin-bottom: 6px; }
    .stats-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0.75rem 0 1rem; }
    .stat-pill {
      background: rgba(10, 10, 22, 0.7); border: 1px solid rgba(108, 99, 255, 0.2);
      border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; color: #c8c8d8;
    }
    .stat-pill b { display: block; color: #e8e8f0; font-size: 1rem; }

    .phase-map {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 0.75rem 0 1rem;
    }
    .phase-card {
      text-align: center; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--muted); background: rgba(8,10,18,0.45); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 8px 2px;
      animation: cardDeal 0.45s ease forwards; opacity: 0;
    }
    .phase-card:nth-child(1) { animation-delay: 0.05s; }
    .phase-card:nth-child(2) { animation-delay: 0.1s; }
    .phase-card:nth-child(3) { animation-delay: 0.15s; }
    .phase-card:nth-child(4) { animation-delay: 0.2s; }
    .phase-card:nth-child(5) { animation-delay: 0.25s; }
    .phase-card .ring { height: 4px; border-radius: 99px; margin-bottom: 6px; background: var(--purple); opacity: 0.6; }
    .phase-card:nth-child(2) .ring { background: var(--teal); }
    .phase-card:nth-child(3) .ring { background: var(--success); }
    .phase-card:nth-child(4) .ring { background: #60a5fa; }
    .phase-card:nth-child(5) .ring { background: var(--gold); }
    @keyframes cardDeal { to { opacity: 1; } }

    .role-cards { display: grid; gap: 8px; margin-bottom: 0.9rem; }
    .role-card {
      background: rgba(12, 12, 24, 0.65); border: 1px solid rgba(108, 99, 255, 0.2);
      border-radius: 10px; padding: 0.75rem 1rem;
      animation: slideIn 0.45s ease forwards; opacity: 0;
    }
    .role-card:nth-child(odd) { animation-name: slideInL; }
    .role-card:nth-child(even) { animation-name: slideInR; }
    .role-card:nth-child(1) { animation-delay: 0.05s; }
    .role-card:nth-child(2) { animation-delay: 0.12s; }
    .role-card:nth-child(3) { animation-delay: 0.2s; }
    @keyframes slideInL { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    @keyframes slideInR { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    .role-card h3 { font-size: 1rem; margin-bottom: 2px; color: var(--text); }
    .role-card p { font-size: 0.95rem; margin: 0; color: var(--muted); line-height: 1.6; }

    .kpi-table { width: 100%; border-collapse: collapse; margin-bottom: 0.9rem; font-size: 0.95rem; }
    .kpi-table th, .kpi-table td { text-align: left; padding: 0.55rem 0.65rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .kpi-table th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .kpi-table tbody tr { animation: rowIn 0.4s ease forwards; opacity: 0; }
    .kpi-table tbody tr:nth-child(1) { animation-delay: 0.08s; }
    .kpi-table tbody tr:nth-child(2) { animation-delay: 0.16s; }
    .kpi-table tbody tr:nth-child(3) { animation-delay: 0.24s; }
    .kpi-table tbody tr:nth-child(4) { animation-delay: 0.32s; }
    @keyframes rowIn { to { opacity: 1; } }
    .kpi-table .good { color: var(--success); font-weight: 700; }
    .kpi-table .bad { color: var(--danger); font-weight: 700; }

    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choice {
      appearance: none; width: 100%; text-align: left; border: none; border-radius: 12px;
      padding: 0.9rem 1.15rem; color: #fff; font-family: var(--font); font-size: 0.95rem;
      cursor: pointer; display: flex; gap: 12px; align-items: flex-start; position: relative; overflow: hidden;
      transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
      min-height: var(--btn-h, auto);
    }
    .choice-purple {
      background: linear-gradient(135deg, #5b54e6, #6c63ff);
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.3);
    }
    .choice-teal {
      background: linear-gradient(135deg, #00b894, #00d4aa);
      box-shadow: 0 8px 24px rgba(0, 212, 170, 0.25);
    }
    .choice:hover, .choice:focus-visible, .choice.kb-focus {
      transform: translateY(-3px); filter: brightness(1.08); outline: none;
    }
    .choice-letter {
      width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.18);
      display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
    }
    .choice-body { flex: 1; min-width: 0; padding-right: 20px; }
    .choice-title { font-weight: 600; color: #fff; margin-bottom: 2px; line-height: 1.4; }
    .choice-sub { font-size: 0.92rem !important; color: rgba(255,255,255,0.85) !important; line-height: 1.55 !important; }
    .choice-arrow { opacity: 0.9; margin-top: 2px; }
    .choice-verdict {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%) scale(0.5);
      font-size: 1.5rem; opacity: 0; z-index: 3; pointer-events: none;
    }
    .choice.right-reveal { box-shadow: 0 0 28px rgba(62, 207, 142, 0.5) !important; animation: greenPulse 0.5s ease; }
    .choice.right-reveal::after {
      content: ""; position: absolute; inset: 0; background: rgba(16, 185, 129, 0.35); z-index: 2; pointer-events: none;
    }
    .choice.right-reveal .choice-verdict { opacity: 1; transform: translateY(-50%) scale(1); }
    .choice.wrong-reveal { animation: shake 0.5s ease; }
    .choice.wrong-reveal::after {
      content: ""; position: absolute; inset: 0; background: rgba(220, 38, 38, 0.45); z-index: 2; pointer-events: none;
    }
    .choice.wrong-reveal .choice-verdict { opacity: 1; transform: translateY(-50%) scale(1); }
    .choice.slide-out { animation: slideOut 0.35s ease forwards; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)}
    }
    @keyframes greenPulse { 40% { transform: scale(1.03); } }
    @keyframes slideOut { to { opacity: 0; transform: translateX(30px); } }

    .point-burst { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
    .point-burst span {
      position: absolute; left: 50%; top: 40%; font-size: 0.7rem; font-weight: 800; color: var(--gold);
      animation: burst 0.7s ease-out forwards;
    }
    @keyframes burst {
      to { opacity: 0; transform: translate(var(--bx), var(--by)); }
    }

    .hint-row { margin-top: 12px; }
    .hint-btn {
      appearance: none; border: 1px dashed rgba(240, 193, 75, 0.5);
      background: rgba(240, 193, 75, 0.1); color: var(--gold);
      font-family: var(--font); font-weight: 700; font-size: 0.9rem;
      padding: 0.55rem 1rem; border-radius: 99px; cursor: pointer;
    }
    .hint-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .hint-panel { max-height: 0; opacity: 0; overflow: hidden; transition: 0.4s; }
    .hint-panel.open { max-height: 200px; opacity: 1; margin-top: 10px; }
    .hint-inner {
      background: rgba(8,10,18,0.6); border: 1px solid rgba(240,193,75,0.3);
      border-radius: 10px; padding: 0.85rem 1rem;
    }
    .hint-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-bottom: 4px; }

    .btn {
      appearance: none; border: none; font-family: var(--font); font-weight: 700;
      font-size: 1.05rem; padding: 1.05rem 1.75rem; border-radius: 12px; cursor: pointer;
      transition: transform 0.15s, filter 0.15s, box-shadow 0.2s;
      min-height: var(--btn-h, auto);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      background: linear-gradient(135deg, #6c63ff 0%, #5b8def 50%, #00d4aa 100%);
      color: #fff;
      box-shadow:
        0 10px 32px rgba(108, 99, 255, 0.4),
        0 0 24px rgba(0, 212, 170, 0.15);
    }
    .btn-primary:hover {
      filter: brightness(1.08);
      box-shadow:
        0 12px 36px rgba(108, 99, 255, 0.5),
        0 0 28px rgba(0, 212, 170, 0.25);
    }
    .btn-ghost {
      background: rgba(10, 10, 22, 0.5); color: #c8c8d8; border: 1px solid rgba(108, 99, 255, 0.25);
    }
    .btn-try {
      background: transparent; color: var(--danger);
      border: 1px solid rgba(240, 113, 120, 0.45);
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

    .points-toast {
      display: inline-flex; font-weight: 700; font-size: 0.95rem;
      padding: 6px 12px; border-radius: 99px; margin-bottom: 10px;
    }
    .points-toast.up { color: var(--success); background: rgba(62,207,142,0.12); border: 1px solid rgba(62,207,142,0.35); }
    .points-toast.down { color: var(--danger); background: rgba(240,113,120,0.12); border: 1px solid rgba(240,113,120,0.35); }

    .scorecard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0.9rem 0; }
    .score-box {
      background: rgba(8,10,18,0.5); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 12px; text-align: center;
    }
    .score-box .num { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
    .score-box .lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 2px; }

    .rank-banner {
      text-align: center; padding: 12px; border-radius: 10px; margin-bottom: 0.9rem;
      font-weight: 700; font-size: 1.05rem; border: 1px solid rgba(255,255,255,0.1);
    }
    .rank-banner.s { color: var(--gold); background: rgba(240,193,75,0.12); }
    .rank-banner.a { color: var(--success); background: rgba(62,207,142,0.12); }
    .rank-banner.b { color: var(--purple); background: rgba(108,99,255,0.12); }
    .rank-banner.c { color: #e6b450; background: rgba(230,180,80,0.12); }
    .rank-banner.d { color: var(--danger); background: rgba(240,113,120,0.12); }

    .footer-note { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 1rem; opacity: 0.85; }

    /* ========== BUILDING COLUMN (desktop: full right panel height) ========== */
    .build-col {
      position: relative;
      height: 100%;
      min-height: 0;
      border-left: 1px solid rgba(108, 99, 255, 0.45);
      box-shadow: inset 1px 0 20px rgba(108, 99, 255, 0.12);
      background: #0a0a1a;
      display: flex; flex-direction: column;
      padding: 10px 14px 14px;
      overflow: hidden;
    }

    .build-header {
      text-align: center; margin-bottom: 8px; flex-shrink: 0;
      position: relative; z-index: 3;
    }
    .build-header h3 {
      font-family: var(--display); font-size: 1.35rem; letter-spacing: 0.08em;
      background: linear-gradient(135deg, #6c63ff, #00d4aa);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .build-header p { font-size: 0.72rem; color: #a8a8c0; text-transform: uppercase; letter-spacing: 0.06em; }

    .build-stage {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 0;
      height: 100%;
    }

    .sky {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(20, 30, 60, 0.5), transparent 55%),
        linear-gradient(180deg, #050510 0%, #0a0a1a 45%, #0c1020 100%);
      z-index: 0;
    }
    .sky::before,
    .sky::after {
      content: "";
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 40% 12%, rgba(255,255,255,0.85), transparent),
        radial-gradient(1px 1px at 55% 35%, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 70% 18%, rgba(255,255,255,0.95), transparent),
        radial-gradient(1px 1px at 85% 40%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1.5px 1.5px at 15% 70%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 60% 65%, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px 1px at 90% 75%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1.5px 1.5px at 33% 80%, rgba(200,220,255,0.7), transparent),
        radial-gradient(1px 1px at 48% 55%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,0.9), transparent);
      background-size: 100% 100%;
      animation: twinkle 4s ease-in-out infinite;
      opacity: 0.85;
    }
    .sky::after {
      background-image:
        radial-gradient(1px 1px at 18% 30%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 42% 50%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 66% 22%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 88% 58%, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 5% 55%, rgba(180,200,255,0.7), transparent),
        radial-gradient(1px 1px at 95% 15%, rgba(255,255,255,0.85), transparent);
      animation-delay: 2s;
      opacity: 0.7;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    .crane {
      position: absolute; top: 4%; right: 8%; width: 28px; height: 45%;
      opacity: 0.35; pointer-events: none;
    }
    .crane-mast {
      position: absolute; left: 50%; top: 0; bottom: 20%; width: 3px;
      background: linear-gradient(#8b95a8, #5a6478); transform: translateX(-50%);
    }
    .crane-arm {
      position: absolute; top: 8%; left: -40px; width: 70px; height: 3px;
      background: #8b95a8;
      animation: craneSway 6s ease-in-out infinite;
      transform-origin: right center;
    }
    .crane-hook {
      position: absolute; top: 8%; left: 0; width: 1px; height: 40px;
      background: #aaa; animation: craneSway 6s ease-in-out infinite;
    }
    @keyframes craneSway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    .building {
      position: relative;
      width: 82%;
      max-width: 340px;
      margin: 0 auto;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    .building .floor,
    .building .foundation-base,
    .building .ground {
      width: 100%;
    }

    .floor {
      position: relative;
      height: var(--floor-h);
      flex: 0 0 var(--floor-h);
      margin: 0 auto;
      width: 100%;
      border: 2px solid rgba(100, 110, 160, 0.2);
      border-bottom: none;
      background: transparent;
      transform-origin: bottom center;
      transition: background 0.5s, border-color 0.5s, box-shadow 0.5s, filter 0.4s, opacity 0.35s;
      overflow: hidden;
      z-index: 2;
    }
    .floor.roof { flex: 0 0 calc(var(--floor-h) + 8px); overflow: visible; }
    .floor:first-child { border-radius: 4px 4px 0 0; }

    .floor.ghost {
      background: transparent;
      border-style: solid;
      border-color: rgba(120, 130, 180, 0.28);
      opacity: 0.65;
      box-shadow: none;
    }
    .floor.ghost .win {
      background: transparent;
      border: 1px solid rgba(100, 110, 150, 0.25);
      box-shadow: none;
    }

    .floor.built {
      background: linear-gradient(180deg, rgba(28, 32, 55, 0.98), rgba(18, 22, 40, 1));
      border-color: rgba(160, 140, 90, 0.35);
      opacity: 1;
      box-shadow: 0 0 16px rgba(255, 180, 60, 0.12);
    }

    .floor.lit {
      background: linear-gradient(180deg, rgba(36, 32, 48, 0.98), rgba(22, 20, 36, 1));
      border-color: rgba(255, 180, 70, 0.45);
      box-shadow:
        inset 0 0 28px rgba(255, 180, 60, 0.12),
        0 0 28px rgba(255, 160, 40, 0.22),
        0 4px 20px rgba(255, 190, 80, 0.15);
    }

    .floor.constructing {
      animation: constructPop 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes constructPop {
      0% { transform: scaleY(0.15) translateY(20px); opacity: 0.3; filter: brightness(2); }
      60% { transform: scaleY(1.05); opacity: 1; }
      100% { transform: scaleY(1); filter: brightness(1); }
    }

    .floor.lighting {
      animation: floorLight 0.9s ease;
    }
    @keyframes floorLight {
      0% { box-shadow: inset 0 0 0 transparent; }
      40% { box-shadow: inset 0 0 40px rgba(0, 212, 170, 0.45), 0 0 40px rgba(108, 99, 255, 0.5); filter: brightness(1.4); }
      100% { filter: brightness(1); }
    }

    .floor.cracked {
      border-color: rgba(240, 113, 120, 0.7);
      background: linear-gradient(180deg, rgba(60, 30, 35, 0.95), rgba(40, 24, 30, 0.98));
      animation: crackShake 0.55s ease;
    }
    .floor.cracked .crack-overlay { opacity: 1; }
    @keyframes crackShake {
      0%,100%{ transform: translateX(0); }
      20%{ transform: translateX(-4px) rotate(-0.5deg); }
      40%{ transform: translateX(4px); }
      60%{ transform: translateX(-3px); }
    }

    .crack-overlay {
      position: absolute; inset: 0; opacity: 0; pointer-events: none;
      background:
        linear-gradient(125deg, transparent 42%, rgba(240,113,120,0.9) 43%, transparent 44%),
        linear-gradient(55deg, transparent 50%, rgba(240,113,120,0.7) 51%, transparent 53%),
        linear-gradient(160deg, transparent 30%, rgba(255,100,80,0.5) 32%, transparent 34%);
      transition: opacity 0.3s;
      z-index: 3;
    }

    .floor-windows {
      position: absolute; inset: 10px 12%;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      z-index: 1;
    }
    .win {
      background: rgba(8, 10, 20, 0.9);
      border-radius: 2px;
      border: 1px solid rgba(40, 45, 70, 0.5);
      transition: background 0.4s, box-shadow 0.4s;
    }
    .floor.built .win,
    .floor.lit .win {
      background: linear-gradient(180deg, #ffe08a 0%, #ffb347 55%, #e8962e 100%);
      border-color: rgba(255, 200, 100, 0.5);
      box-shadow:
        0 0 10px rgba(255, 180, 50, 0.85),
        0 0 18px rgba(255, 160, 40, 0.45),
        inset 0 0 6px rgba(255, 255, 200, 0.35);
      animation: windowFlicker 3.2s ease-in-out infinite;
    }
    .floor.lit .win:nth-child(2) { animation-delay: 0.4s; }
    .floor.lit .win:nth-child(3) { animation-delay: 0.9s; background: linear-gradient(180deg, #ffd56a, #ff9f2e); }
    .floor.lit .win:nth-child(5) { animation-delay: 1.2s; }
    .floor.built .win:nth-child(odd) { animation-delay: 0.6s; }
    .floor.cracked .win {
      background: rgba(80, 30, 30, 0.6);
      border-color: rgba(120, 40, 40, 0.4);
      box-shadow: none;
      animation: none;
    }
    @keyframes windowFlicker {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.82; filter: brightness(0.9); }
    }

    .floor-label {
      position: absolute; left: -4px; top: 50%; transform: translate(-100%, -50%);
      font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); white-space: nowrap; padding-right: 6px;
      max-width: 72px; text-align: right; line-height: 1.2;
      opacity: 0.7;
    }
    .floor.lit .floor-label, .floor.built .floor-label { opacity: 1; color: var(--teal); }
    .floor.cracked .floor-label { color: var(--danger); }
    .floor.active-floor .floor-label {
      color: var(--gold); opacity: 1; font-weight: 700;
      text-shadow: 0 0 10px rgba(240, 193, 75, 0.4);
    }

    /* Rooftop special */
    .floor.roof {
      height: calc(var(--floor-h) + 8px);
      background: transparent;
      border: none;
      overflow: visible;
    }
    .roof-shape {
      position: absolute; left: -6%; right: -6%; bottom: 0; height: 70%;
      background: linear-gradient(180deg, #3d4570, #2a3148);
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      border: none;
      opacity: 0.35;
      transition: opacity 0.5s, filter 0.5s;
    }
    .floor.roof.ghost .roof-shape {
      background: repeating-linear-gradient(-45deg, rgba(108,99,255,0.08), rgba(108,99,255,0.08) 5px, transparent 5px, transparent 10px);
      opacity: 0.4;
    }
    .floor.roof.built .roof-shape, .floor.roof.lit .roof-shape {
      opacity: 1;
      filter: drop-shadow(0 0 16px rgba(240, 193, 75, 0.35));
    }
    .floor.roof.lit .roof-shape {
      background: linear-gradient(180deg, #5b54e6, #00d4aa);
    }
    .floor.roof.cracked .roof-shape {
      background: linear-gradient(180deg, #8b3a3a, #4a2020);
      opacity: 1;
    }
    .roof-flag {
      position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
      font-size: 1.2rem; opacity: 0; transition: opacity 0.4s, transform 0.5s;
      z-index: 5;
    }
    .floor.roof.lit .roof-flag { opacity: 1; animation: flagWave 2s ease-in-out infinite; }
    @keyframes flagWave {
      0%,100%{ transform: translateX(-50%) rotate(-5deg); }
      50%{ transform: translateX(-50%) rotate(8deg); }
    }

    /* Blinking red antenna light on rooftop */
    .antenna {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 18px;
      background: linear-gradient(#889, #556);
      z-index: 6;
      opacity: 0.5;
      transition: opacity 0.4s;
    }
    .antenna::after {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff2a2a;
      box-shadow: 0 0 6px #ff2020, 0 0 14px rgba(255, 40, 40, 0.8);
      animation: antennaBlink 1.1s ease-in-out infinite;
    }
    .floor.roof.built .antenna,
    .floor.roof.lit .antenna { opacity: 1; }
    .floor.roof.ghost .antenna { opacity: 0.35; }
    @keyframes antennaBlink {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px #ff2020, 0 0 14px rgba(255, 40, 40, 0.9); }
      50% { opacity: 0.25; box-shadow: 0 0 2px #ff2020; }
    }

    /* Foundation base */
    .foundation-base {
      height: 18px;
      background: linear-gradient(180deg, #2a3048, #1a1e30);
      border-radius: 0 0 4px 4px;
      border: 2px solid rgba(100, 110, 150, 0.25);
      border-top: none;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      z-index: 2;
    }
    .foundation-base::after {
      content: "";
      position: absolute; left: -10%; right: -10%; bottom: -8px; height: 10px;
      background: rgba(0,0,0,0.35); border-radius: 50%; filter: blur(4px);
    }

    .ground {
      height: 28px; margin-top: 4px;
      background: linear-gradient(180deg, #3d8f45 0%, #2a6b32 40%, #1e4d24 100%);
      border-radius: 4px;
      position: relative;
      box-shadow:
        inset 0 3px 0 rgba(120, 200, 100, 0.35),
        inset 0 6px 10px rgba(0,0,0,0.2),
        0 6px 16px rgba(0,0,0,0.4);
      z-index: 2;
    }
    .ground::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 0; height: 7px;
      background: linear-gradient(180deg, #5cb85c, transparent);
      border-radius: 4px 4px 0 0;
      opacity: 0.85;
    }
    .ground::after {
      content: "SITE";
      position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
      font-size: 0.5rem; letter-spacing: 0.14em; color: rgba(255,255,255,0.4);
      font-weight: 700;
    }

    /* Climber — 60px YOU with hard hat */
    .climber {
      position: absolute;
      left: 50%;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      z-index: 10;
      transition: bottom 0.85s cubic-bezier(0.22, 1, 0.36, 1), filter 0.35s, transform 0.35s;
      bottom: 48px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55));
      pointer-events: none;
    }
    .climber-hat {
      font-size: 1.15rem;
      line-height: 1;
      margin-bottom: -4px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
      animation: climbBob 1.4s ease-in-out infinite;
    }
    .climber-face {
      font-size: 2rem; line-height: 1;
      animation: climbBob 1.4s ease-in-out infinite;
      animation-delay: 0.05s;
    }
    .climber-tag {
      font-size: 0.55rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--gold);
      background: rgba(0,0,0,0.65); padding: 2px 6px; border-radius: 4px;
      white-space: nowrap; margin-top: 1px;
      border: 1px solid rgba(240, 193, 75, 0.35);
    }
    .climber.celebrate .climber-face,
    .climber.celebrate .climber-hat { animation: celeb 0.6s ease; }
    .climber.hurt .climber-face,
    .climber.hurt .climber-hat { animation: hurt 0.5s ease; }
    .climber.decision-glow {
      filter:
        drop-shadow(0 0 12px rgba(108, 99, 255, 0.85))
        drop-shadow(0 0 22px rgba(0, 212, 170, 0.55))
        drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      animation: decisionPulse 0.7s ease;
    }
    @keyframes climbBob {
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-4px); }
    }
    @keyframes celeb {
      0%,100%{ transform: scale(1); }
      40%{ transform: scale(1.25) translateY(-8px); }
    }
    @keyframes hurt {
      0%,100%{ transform: rotate(0); }
      25%{ transform: rotate(-15deg); }
      75%{ transform: rotate(12deg); }
    }
    @keyframes decisionPulse {
      0% { filter: drop-shadow(0 0 4px rgba(108,99,255,0.3)); }
      40% { filter: drop-shadow(0 0 18px rgba(0,212,170,0.9)) drop-shadow(0 0 28px rgba(108,99,255,0.7)); }
      100% { filter: drop-shadow(0 4px 10px rgba(0,0,0,0.55)); }
    }

    .build-legend {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
      margin-top: 8px; flex-shrink: 0;
    }
    .leg {
      font-size: 0.58rem; color: var(--muted); display: flex; align-items: center; gap: 4px;
    }
    .leg i {
      width: 8px; height: 8px; border-radius: 2px; display: inline-block;
    }
    .leg i.lit { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
    .leg i.crack { background: var(--danger); }
    .leg i.ghost { background: transparent; border: 1px dashed rgba(108,99,255,0.5); }

    .spark {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); pointer-events: none; z-index: 20;
      animation: sparkUp 0.8s ease-out forwards;
    }
    @keyframes sparkUp {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.3); }
    }

    /* Overview */
    .overview-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(5,7,12,0.75); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .overview-overlay.open { display: flex; }
    .overview-sheet {
      width: 100%; max-width: 640px; max-height: 88vh;
      background: var(--panel); border: 1px solid rgba(108,99,255,0.3);
      border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .overview-header {
      padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; gap: 12px;
    }
    .overview-header h2 { font-size: 1.5rem; margin: 0 0 4px; -webkit-text-fill-color: transparent; }
    .overview-header p { font-size: 0.95rem; color: var(--muted); margin: 0; line-height: 1.6; }
    .overview-close {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12);
      background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem;
    }
    .overview-body { overflow-y: auto; padding: 1rem 1.25rem; }
    .overview-step {
      display: grid; grid-template-columns: 36px 1fr; gap: 10px; margin-bottom: 0.9rem;
      animation: rowIn 0.4s ease forwards; opacity: 0;
    }
    .overview-step:nth-child(n) { animation-delay: calc(0.05s * var(--i, 1)); }
    .ov-num {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--purple);
      color: var(--purple); font-weight: 800; font-size: 0.8rem; display: grid; place-items: center;
    }
    .ov-content {
      background: rgba(8,10,18,0.5); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 0.75rem 0.9rem;
    }
    .ov-content h3 { font-size: 1.05rem; margin-bottom: 4px; color: var(--text); }
    .ov-content p { font-size: 0.95rem; line-height: 1.7; color: var(--muted); margin: 0; }
    .ov-tip { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); color: var(--success); font-weight: 600; font-size: 0.92rem; }
    .overview-footer {
      padding: 0.85rem 1.25rem; border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; gap: 8px; flex-wrap: wrap;
    }

    .share-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
      z-index: 320; background: var(--elevated); border: 1px solid rgba(62,207,142,0.4);
      color: var(--success); font-weight: 700; padding: 10px 18px; border-radius: 99px;
      opacity: 0; transition: 0.25s; pointer-events: none;
    }
    .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .fly-score {
      position: fixed; z-index: 250; font-weight: 800; font-size: 1.2rem;
      pointer-events: none; animation: flyScore 0.85s ease forwards;
    }
    .fly-score.up { color: var(--success); }
    .fly-score.down { color: var(--danger); }
    @keyframes flyScore {
      0% { opacity: 1; transform: translate(-50%,-50%) scale(0.7); }
      100% { opacity: 0; transform: translate(-50%,-160%) scale(1); }
    }

    /* ========== DESKTOP (≥900px): full-quality split experience ========== */
    @media (min-width: 900px) {
      :root {
        --floor-h: 120px;
        --story-w: 55%;
        --build-w: 45%;
        --scene-max: 600px;
        --btn-h: auto;
        --anim-scale: 1;
      }
      .skip-btn span.short { display: none; }
      .game {
        grid-template-columns: 55% 45%;
      }
      .build-col {
        height: calc(100vh - var(--hud-h));
        max-height: calc(100% );
      }
      .floor-windows { inset: 14px 14%; gap: 8px; }
      .win { border-radius: 3px; }
      .climber { width: 60px; height: 60px; margin-left: -30px; }
      .climber-face { font-size: 2rem; }
      .climber-hat { font-size: 1.2rem; }
      .floor-label {
        font-size: 0.7rem;
        max-width: 90px;
        font-weight: 600;
      }
    }

    /* ========== MOBILE (<900px): single column, mini tower above story ========== */
    @media (max-width: 899px) {
      :root {
        --floor-h: 24px;
        --story-w: 100%;
        --build-w: 100%;
        --scene-max: 100%;
        --body-size: 1.12rem;
        --btn-h: 60px;
        --anim-scale: 0;
        --hud-h: 52px;
      }

      body {
        font-size: var(--body-size);
        overflow: hidden;
      }

      .game {
        grid-template-columns: 1fr;
        grid-template-rows: 200px 1fr;
        height: 100%;
      }

      /* Mini building above story card */
      .build-col {
        order: 0;
        height: 200px;
        max-height: 200px;
        min-height: 200px;
        border-left: none;
        border-bottom: 1px solid rgba(108, 99, 255, 0.3);
        padding: 4px 8px 6px;
      }
      .story-col {
        order: 1;
        min-height: 0;
      }

      .build-header { margin-bottom: 2px; }
      .build-header h3 { font-size: 0.95rem; }
      .build-header p { font-size: 0.6rem; }
      .build-legend { display: none; }
      .crane { display: none; }

      .building {
        max-width: 140px;
        width: 42%;
      }
      .floor-label { display: none; }
      .foundation-base { height: 10px; }
      .ground { height: 14px; }
      .ground::before { font-size: 0.45rem; }

      .climber { width: 26px; height: 30px; margin-left: -13px; }
      .climber-face { font-size: 1.15rem; }
      .climber-tag { font-size: 0.42rem; }

      /* Only current floor highlighted — others dimmed */
      .floor:not(.active-floor) {
        opacity: 0.32;
        filter: saturate(0.35) brightness(0.55);
      }
      .floor.active-floor {
        opacity: 1 !important;
        filter: none !important;
        box-shadow: 0 0 14px rgba(0, 212, 170, 0.45), inset 0 0 12px rgba(108, 99, 255, 0.2);
        z-index: 2;
      }
      .floor.active-floor.cracked {
        box-shadow: 0 0 14px rgba(240, 113, 120, 0.5);
      }
      .floor.lit:not(.active-floor) {
        opacity: 0.4;
        filter: saturate(0.5) brightness(0.7);
      }

      /* Simplified animations for performance */
      .floor.constructing { animation: none; transition: background 0.25s, opacity 0.25s; }
      .floor.lighting { animation: none; }
      .crane-arm, .crane-hook, .climber-face { animation: none !important; }
      .floor.lit .win { animation: none; }
      .roof-flag { animation: none !important; }
      .scene {
        transform: none;
        filter: none;
        transition: opacity 0.25s, visibility 0s linear 0.25s;
        padding: 10px 12px 20px;
      }
      .scene.active { transform: none; filter: none; }
      .scene.exit { transform: none; filter: none; opacity: 0; }
      .role-card, .phase-card, .kpi-table tbody tr { animation: none !important; opacity: 1 !important; }

      /* Thumb-friendly full-width controls */
      .choice {
        min-height: 60px;
        width: 100%;
        padding: 0.85rem 1rem;
        font-size: 1rem;
        align-items: center;
        border-radius: 14px;
      }
      .choice-title { font-size: 1.02rem; }
      .choice-sub { font-size: 0.95rem !important; line-height: 1.45 !important; }
      .btn {
        min-height: 60px;
        width: 100%;
        font-size: 1.05rem;
        border-radius: 14px;
      }
      .btn-row {
        flex-direction: column;
        width: 100%;
      }
      .hint-btn {
        min-height: 48px;
        width: 100%;
        font-size: 1rem;
      }

      h1 { font-size: clamp(2.2rem, 10vw, 3rem); }
      h2 { font-size: clamp(1.55rem, 7vw, 2.1rem); }
      p, .lead, .flavor, .consequence, .hint-body {
        font-size: 1.12rem;
        line-height: 1.85;
      }
      .panel { padding: 1.1rem 1rem; border-radius: 14px; }
      .scorecard { grid-template-columns: 1fr; }

      .hud {
        flex-wrap: wrap;
        height: auto;
        min-height: var(--hud-h);
        padding-bottom: 6px;
        gap: 6px;
      }
      .progress-wrap { order: 3; flex: 1 1 100%; max-width: none; }
      .skip-btn span.full { display: none; }
      .skip-btn span.short { display: inline; }

      .icon-btn { width: 44px; height: 44px; font-size: 1.15rem; }
      .score-chip { font-size: 1rem; padding: 8px 14px; min-height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body data-layout="desktop">
  <header class="hud" id="hud">
    <div class="brand">OpEx <span>Build</span></div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-meta">
        <span id="phaseLabel">Site prep</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="score-chip" id="scoreChip">⚡ <span class="pts" id="scorePts">0</span></div>
    <div class="hud-actions">
      <button type="button" class="skip-btn" id="skipBtn" title="Executive overview">
        <span class="full">Skip to End</span><span class="short">Skip</span>
      </button>
      <button type="button" class="icon-btn" id="soundBtn" aria-label="Sound" aria-pressed="false" title="Sound off">🔇</button>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Theme" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="game">
    <div class="story-col">
      <main class="stage" id="stage" aria-live="polite"></main>
    </div>

    <aside class="build-col" id="buildCol" aria-label="OpEx building progress">
      <div class="build-header">
        <h3>THE OPEX TOWER</h3>
        <p id="buildStatus">Foundation ready · Phase 1</p>
      </div>
      <div class="build-stage" id="buildStage">
        <div class="sky"></div>
        <div class="crane" aria-hidden="true">
          <div class="crane-mast"></div>
          <div class="crane-arm"></div>
          <div class="crane-hook"></div>
        </div>

        <div class="climber" id="climber" style="bottom: 46px;">
          <div class="climber-hat" aria-hidden="true">⛑️</div>
          <div class="climber-face" id="climberFace">👷</div>
          <div class="climber-tag">YOU</div>
        </div>

        <div class="building" id="building">
          <!-- top to bottom in DOM for visual stack via column-reverse? We'll order manually bottom-up with flex column-reverse -->
        </div>
      </div>
      <div class="build-legend">
        <span class="leg"><i class="lit"></i> Lit = solid OpEx</span>
        <span class="leg"><i class="crack"></i> Crack = pitfall</span>
        <span class="leg"><i class="ghost"></i> Ghost = upcoming</span>
      </div>
    </aside>
  </div>

  <div class="share-toast" id="shareToast">Copied!</div>

  <div class="overview-overlay" id="overviewOverlay" hidden>
    <div class="overview-sheet">
      <div class="overview-header">
        <div>
          <h2>Full Journey Overview</h2>
          <p>Executive briefing — the complete OpEx build path.</p>
        </div>
        <button type="button" class="overview-close" id="overviewClose" aria-label="Close">✕</button>
      </div>
      <div class="overview-body" id="overviewBody"></div>
      <div class="overview-footer">
        <button type="button" class="btn btn-primary" id="overviewPlay">Play the adventure →</button>
        <button type="button" class="btn btn-ghost" id="overviewClose2">Close</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    // ——— Theme ———
    const root = document.documentElement;
    const themeBtn = document.getElementById("themeBtn");
    let theme = "dark";
    function applyTheme(t) {
      theme = t;
      if (t === "light") { root.setAttribute("data-theme", "light"); themeBtn.textContent = "☀️"; }
      else { root.removeAttribute("data-theme"); themeBtn.textContent = "🌙"; }
    }
    applyTheme(theme);
    themeBtn.addEventListener("click", () => { applyTheme(theme === "dark" ? "light" : "dark"); playSound("click"); });

    // ——— Sound ———
    let soundOn = false;
    let audioCtx = null;
    const soundBtn = document.getElementById("soundBtn");
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, start, dur, type, gainVal, slideTo) {
      const ctx = ensureAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      if (slideTo != null) osc.frequency.linearRampToValueAtTime(slideTo, ctx.currentTime + start + dur);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(gainVal, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.02);
    }
    function playSound(kind) {
      if (!soundOn) return;
      try {
        if (kind === "click") tone(520, 0, 0.05, "triangle", 0.04);
        else if (kind === "success") { tone(523, 0, 0.18, "sine", 0.06); tone(659, 0.05, 0.2, "sine", 0.05); tone(784, 0.1, 0.28, "sine", 0.05); }
        else if (kind === "fail") { tone(220, 0, 0.35, "sawtooth", 0.04, 110); }
        else if (kind === "points") { tone(440, 0, 0.08, "square", 0.03, 660); tone(660, 0.06, 0.1, "square", 0.025, 880); }
        else if (kind === "pointsDown") tone(400, 0, 0.1, "square", 0.03, 240);
        else if (kind === "build") { tone(300, 0, 0.1, "triangle", 0.04); tone(450, 0.08, 0.15, "triangle", 0.04); }
      } catch (_) {}
    }
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
      soundBtn.textContent = soundOn ? "🔊" : "🔇";
      soundBtn.title = soundOn ? "Sound on" : "Sound off";
      if (soundOn) { ensureAudio(); playSound("click"); }
    });

    // ——— Floors definition (bottom → top index) ———
    const FLOORS = [
      { id: "foundation", label: "Foundation", phase: "Phase 1 · Partnership", short: "Partnership" },
      { id: "floor1", label: "Floor 1", phase: "Phase 2 · Specialists", short: "Specialists" },
      { id: "floor2", label: "Floor 2", phase: "Phase 3 · Training", short: "Training" },
      { id: "floor3", label: "Floor 3", phase: "Phase 4 · Data", short: "Data" },
      { id: "roof", label: "Rooftop", phase: "Phase 5 · Full Dept", short: "Full Dept", isRoof: true }
    ];

    // Scene → floor index (0–4)
    function floorForScene(id) {
      if (!id || id === "title" || id === "intro") return -1;
      if (id.startsWith("p1") || id.startsWith("kpi") || id.startsWith("growth")) return 0;
      if (id.startsWith("p2")) return 1;
      if (id.startsWith("p3")) return 2;
      if (id.startsWith("p4")) return 3;
      if (id.startsWith("p5") || id === "finale") return 4;
      return -1;
    }

    // Completing these good scenes lights the corresponding floor
    const COMPLETE_FLOOR = {
      p1_ops: 0, p1_recover: 0,
      // kpi/growth reinforce foundation — light foundation if not lit, else prep floor1
      kpi_good: 0, kpi_recover: 0,
      growth_good: 0, growth_recover: 0,
      p2_peers: 1, p2_recover: 1,
      p3_hands: 2, p3_recover: 2,
      p4_hire: 3, p4_recover: 3,
      p5_serve: 4, p5_recover: 4,
      finale: 4
    };

    // ——— Building state ———
    // status per floor: ghost | built | lit | cracked
    let floorState = ["ghost", "ghost", "ghost", "ghost", "ghost"];
    let climberLevel = -1; // -1 ground, 0–4 floors
    let highestLit = -1;

    const buildingEl = document.getElementById("building");
    const climberEl = document.getElementById("climber");
    const climberFace = document.getElementById("climberFace");
    const buildStatus = document.getElementById("buildStatus");
    const buildStage = document.getElementById("buildStage");

    function buildBuildingDOM() {
      // Top → bottom in DOM (roof first, foundation last)
      buildingEl.style.display = "flex";
      buildingEl.style.flexDirection = "column";
      buildingEl.style.alignItems = "center";
      const floorsTopDown = [];
      for (let i = FLOORS.length - 1; i >= 0; i--) {
        const f = FLOORS[i];
        if (f.isRoof) {
          floorsTopDown.push(`
            <div class="floor roof ghost" data-floor="${i}" id="floor-${i}">
              <span class="floor-label">${f.short}</span>
              <div class="antenna" aria-hidden="true"></div>
              <div class="roof-shape"></div>
              <div class="roof-flag">🚩</div>
              <div class="crack-overlay"></div>
            </div>`);
        } else {
          floorsTopDown.push(`
            <div class="floor ghost" data-floor="${i}" id="floor-${i}">
              <span class="floor-label">${f.short}</span>
              <div class="floor-windows">
                <div class="win"></div><div class="win"></div><div class="win"></div><div class="win"></div>
                <div class="win"></div><div class="win"></div><div class="win"></div><div class="win"></div>
              </div>
              <div class="crack-overlay"></div>
            </div>`);
        }
      }
      buildingEl.innerHTML = floorsTopDown.join("") + `
        <div class="foundation-base" aria-hidden="true"></div>
        <div class="ground" aria-hidden="true"></div>
      `;
    }
    buildBuildingDOM();

    function applyFloorClasses() {
      FLOORS.forEach((_, i) => {
        const el = document.getElementById("floor-" + i);
        if (!el) return;
        const st = floorState[i];
        el.classList.remove("ghost", "built", "lit", "cracked", "active-floor");
        el.classList.add(st === "ghost" ? "ghost" : st);
        if (i === climberLevel) el.classList.add("active-floor");
      });
    }

    function climberBottomPx(level) {
      // ground ≈ 46px; each floor ~ floor-h; foundation base 18 + ground 28
      const styles = getComputedStyle(document.documentElement);
      const fh = parseFloat(styles.getPropertyValue("--floor-h")) || 56;
      const groundPad = 46;
      if (level < 0) return groundPad;
      // stand on top of floor level (foundation=0)
      return groundPad + 18 + (level + 1) * fh - 8;
    }

    function moveClimber(level) {
      climberLevel = level;
      climberEl.style.bottom = climberBottomPx(level) + "px";
      applyFloorClasses();
    }

    function sparkBurst(floorIndex) {
      const el = document.getElementById("floor-" + floorIndex);
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const stageRect = buildStage.getBoundingClientRect();
      for (let i = 0; i < 10; i++) {
        const s = document.createElement("div");
        s.className = "spark";
        const x = rect.left - stageRect.left + rect.width * Math.random();
        const y = rect.top - stageRect.top + rect.height * 0.4;
        s.style.left = x + "px";
        s.style.top = y + "px";
        const ang = Math.random() * Math.PI * 2;
        const dist = 20 + Math.random() * 40;
        s.style.setProperty("--sx", Math.cos(ang) * dist + "px");
        s.style.setProperty("--sy", Math.sin(ang) * dist - 30 + "px");
        buildStage.appendChild(s);
        setTimeout(() => s.remove(), 800);
      }
    }

    function constructAndLight(floorIndex) {
      if (floorIndex < 0 || floorIndex > 4) return;
      // Light all floors below
      for (let i = 0; i <= floorIndex; i++) {
        if (floorState[i] === "ghost" || floorState[i] === "cracked" || floorState[i] === "built") {
          floorState[i] = i === floorIndex ? "built" : "lit";
        }
      }
      // Light floors below fully
      for (let i = 0; i < floorIndex; i++) {
        if (floorState[i] !== "cracked") floorState[i] = "lit";
      }
      floorState[floorIndex] = "built";
      applyFloorClasses();

      const el = document.getElementById("floor-" + floorIndex);
      if (el) {
        el.classList.add("constructing");
        setTimeout(() => {
          el.classList.remove("constructing");
          floorState[floorIndex] = "lit";
          el.classList.add("lighting");
          applyFloorClasses();
          sparkBurst(floorIndex);
          playSound("build");
          setTimeout(() => el.classList.remove("lighting"), 900);
        }, 700);
      }
      highestLit = Math.max(highestLit, floorIndex);
      moveClimber(floorIndex);
      climberEl.classList.remove("hurt");
      climberEl.classList.add("celebrate");
      climberFace.textContent = "😄";
      setTimeout(() => {
        climberEl.classList.remove("celebrate");
        climberFace.textContent = "👷";
      }, 700);
      updateBuildStatus();
    }

    function crackFloor(floorIndex) {
      if (floorIndex < 0) floorIndex = 0;
      // If floor still ghost, mark as active cracked construction
      if (floorState[floorIndex] === "ghost") floorState[floorIndex] = "built";
      floorState[floorIndex] = "cracked";
      applyFloorClasses();
      const el = document.getElementById("floor-" + floorIndex);
      if (el) {
        el.classList.remove("cracked");
        void el.offsetWidth;
        el.classList.add("cracked");
      }
      moveClimber(floorIndex);
      climberEl.classList.remove("celebrate");
      climberEl.classList.add("hurt");
      climberFace.textContent = "😧";
      setTimeout(() => {
        climberEl.classList.remove("hurt");
        climberFace.textContent = "👷";
      }, 600);
      updateBuildStatus();
    }

    function repairFloor(floorIndex) {
      if (floorIndex < 0) return;
      if (floorState[floorIndex] === "cracked") {
        floorState[floorIndex] = "lit";
        applyFloorClasses();
        const el = document.getElementById("floor-" + floorIndex);
        if (el) {
          el.classList.add("lighting");
          setTimeout(() => el.classList.remove("lighting"), 800);
        }
        sparkBurst(floorIndex);
      }
      moveClimber(floorIndex);
      updateBuildStatus();
    }

    function updateBuildStatus() {
      if (climberLevel < 0) {
        buildStatus.textContent = "Site prep · Start building";
        return;
      }
      const f = FLOORS[climberLevel];
      const st = floorState[climberLevel];
      const statusWord = st === "lit" ? "Lit ✓" : st === "cracked" ? "Damaged!" : st === "built" ? "Under construction" : "Planned";
      buildStatus.textContent = `${f.phase} · ${statusWord}`;
    }

    function resetBuilding() {
      floorState = ["ghost", "ghost", "ghost", "ghost", "ghost"];
      highestLit = -1;
      climberLevel = -1;
      applyFloorClasses();
      moveClimber(-1);
      updateBuildStatus();
    }

    function syncBuildingToScene(id, scene, opts) {
      const fi = floorForScene(id);

      // Active work on this floor — if ghost, show as built (in progress)
      if (fi >= 0 && floorState[fi] === "ghost" && id !== "title") {
        // Only mark active floor as under construction outline
        // leave ghost until first good/bad
      }

      if (opts && opts.applyPoints && scene) {
        if (scene.good === true) {
          const completeIdx = COMPLETE_FLOOR[id];
          if (completeIdx != null) {
            // recovery repairs crack then lights
            if (id.includes("recover") && floorState[completeIdx] === "cracked") {
              repairFloor(completeIdx);
            }
            constructAndLight(completeIdx);
          } else if (fi >= 0) {
            // intermediate good within phase
            if (floorState[fi] === "cracked") repairFloor(fi);
            else if (floorState[fi] === "ghost") {
              floorState[fi] = "built";
              applyFloorClasses();
              moveClimber(fi);
            }
          }
        } else if (scene.good === false) {
          crackFloor(fi >= 0 ? fi : 0);
        }
      } else {
        // Navigation only — move climber to relevant floor
        if (fi >= 0) {
          // ensure lower floors that were lit stay lit
          moveClimber(Math.max(fi, highestLit >= 0 && fi > highestLit ? highestLit : fi));
          // If revisiting, stand on this floor
          if (floorState[fi] !== "ghost" || highestLit >= fi) {
            moveClimber(fi);
          } else if (highestLit >= 0) {
            moveClimber(Math.min(fi, highestLit + 1));
          } else {
            moveClimber(fi === 0 ? 0 : -1);
            if (fi === 0) {
              // step onto foundation work zone
              moveClimber(0);
              if (floorState[0] === "ghost") {
                floorState[0] = "built";
                applyFloorClasses();
              }
            }
          }
        } else {
          moveClimber(-1);
        }
      }
      updateBuildStatus();
    }

    // ——— Game state ———
    let score = 0, displayScore = 0;
    let currentSceneId = "title";
    let history = [], navStack = [], lastChoiceFrom = null;
    let goodChoices = 0, badChoices = 0;
    let hintsUsedOnScene = {};
    let journeyStartTime = null;
    let selectedChoiceIndex = 0;
    let scoreAnimRaf = null;
    let activeEl = null, transitioning = false;

    const SAVE_KEY = "opex-journey-state-v1";

    function saveProgress() {
      try {
        const data = {
          score, currentSceneId, floorState: [...floorState],
          goodChoices, badChoices, journeyStartTime,
          highestLit: typeof highestLit !== "undefined" ? highestLit : 0,
          ts: Date.now()
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      } catch (_) {}
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (_) { return null; }
    }

    function clearProgress() {
      try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
    }

    const phaseNames = {
      0: "Site prep", 1: "Partnership", 2: "KPIs", 3: "Growth",
      4: "Specialists", 5: "Training", 6: "Data", 7: "Full Dept", 8: "Rooftop"
    };

    // ——— Story (preserved) ———
    const scenes = {
      title: {
        phase: 0, progress: 0, mood: "good",
        render() {
          return `
            <div class="panel">
              <div class="hero-icon">🏗️</div>
              <div class="badge gold">Commercial Roofing Edition</div>
              <h1>The OpEx Journey</h1>
              <div class="text-block">
                <p class="lead">
                  You’re building an <strong>Operational Excellence</strong> program from nothing —
                  while crews are still on roofs, estimators are still guessing, and
                  “we’ve always done it this way” is the unofficial company anthem.
                </p>
              </div>
              <div class="text-block">
                <p class="flavor">
                  Five floors. Tough calls. Good decisions raise the tower. Bad ones crack the concrete.
                  Earn OpEx points. Climb to the rooftop.
                </p>
              </div>
              <div class="phase-map">
                <div class="phase-card"><div class="ring"></div>Partner</div>
                <div class="phase-card"><div class="ring"></div>Field</div>
                <div class="phase-card"><div class="ring"></div>Train</div>
                <div class="phase-card"><div class="ring"></div>Data</div>
                <div class="phase-card"><div class="ring"></div>Dept</div>
              </div>
              <div class="stats-row">
                <div class="stat-pill"><b>5</b> Floors</div>
                <div class="stat-pill"><b>⚡</b> OpEx Score</div>
                <div class="stat-pill"><b>👷</b> Climb the tower</div>
              </div>
              <div class="btn-row">
                <button type="button" class="btn btn-primary" data-goto="intro">Break ground →</button>
                ${window.__opexSaved && window.__opexSaved.currentSceneId && window.__opexSaved.currentSceneId !== "title" ? `<button type="button" class="btn btn-ghost" id="resumeBtn">Resume journey →</button>` : ""}
              </div>
              <p class="footer-note">Construction CYOA · Watch the tower react · Mobile friendly</p>
            </div>`;
        }
      },
      intro: {
        phase: 0, progress: 6, mood: "good",
        render() {
          return `
            <div class="panel">
              <div class="badge">Mission Briefing</div>
              <h2>The roof is on fire (figuratively… for now)</h2>
              <div class="text-block">
                <p class="lead">
                  Your commercial roofing company is growing fast. Jobs are stacking up.
                  Warranty callbacks are too. Nobody can agree on what “done right” even means.
                </p>
              </div>
              <div class="text-block">
                <p class="flavor">
                  Leadership wants OpEx. The field wants fewer headaches. Finance wants fewer surprises.
                  You? You’re the person who has to make it real — one decision at a time.
                </p>
              </div>
              <div class="text-block">
                <p class="consequence">
                  Rule of the game: <strong>good decisions earn OpEx points and raise the next floor</strong>.
                  Bad ones crack the tower. Sometimes you recover. Sometimes you rebuild.
                  Use <strong>Hints</strong> if you’re stuck — first one’s free.
                </p>
              </div>
              <div class="btn-row">
                <button type="button" class="btn btn-primary" data-goto="p1_start">Pour the foundation →</button>
              </div>
            </div>`;
        }
      },
      p1_start: {
        phase: 1, progress: 12, mood: "good", choiceScene: true,
        hints: [
          "OpEx needs someone who owns the work on the ground — not just the bid. Look for operational air cover.",
          "Sales can be a great ally later, but founding partners who live in the field chaos unlock credibility fastest."
        ],
        render() {
          return `
            <div class="panel">
              <div class="badge">Phase 1 · Foundation · Partnership</div>
